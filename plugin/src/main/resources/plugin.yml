name: NoobHubPay
version: '1.0.0'
main: com.noobhub.pay.NoobHubPay
api-version: '1.21'
author: NoobHub
description: Multi-payment system supporting WeChat, Alipay and in-game currency
depend: [Vault]

commands:
  store:
    description: Open store GUI
    usage: /store
  phone:
    description: Bind or change phone number
    usage: /phone [phone] [old_phone new_phone]
  payadmin:
    description: Admin commands for payment system
    usage: /payadmin <reload|test|list>
    permission: noobhub.pay.admin

permissions:
  noobhub.pay.admin:
    description: Admin permission for payment system
    default: op
  noobhub.pay.store:
    description: Use store GUI
    default: true
  noobhub.pay.phone:
    description: Bind phone number
    default: true
