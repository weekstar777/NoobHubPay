# NoobHubPay 配置文件

# HTTP服务器配置(用于接收外部监控程序的支付通知)
http-server:
  enabled: true
  port: 8787
  # 安全密钥,用于验证请求来源,请修改为随机字符串
  secret-key: "change-this-to-random-secret-key"
  # 绑定地址,建议仅本机访问
  bind-address: "127.0.0.1"

# 支付方式配置
payment-methods:
  # 微信支付(通过窗口监控)
  wechat:
    enabled: true
    # 监控的窗口标题
    window-title: "服务通知"
    # 字段映射配置
    fields:
      - key: "收款金额"
        value-type: "amount"
      - key: "收款项"
        value-type: "product"
      - key: "付款方信息"
        value-type: "player"

  # 支付宝支付(通过窗口监控)
  alipay:
    enabled: true
    window-title: "支付宝通知"
    fields:
      - key: "收款金额"
        value-type: "amount"
      - key: "收款项"
        value-type: "product"
      - key: "付款方信息"
        value-type: "player"

  # 游戏内货币支付(Vault)
  vault:
    enabled: true

# 商品配置
products:
  - name: "64个钻石块"
    price: 68.00
    # 发货命令,支持变量: {player}玩家名
    commands:
      - "/give {player} minecraft:diamond_block 64"
    description: "§6购买64个钻石块"

  - name: "铁套装"
    price: 50.00
    commands:
      - "/give {player} minecraft:iron_helmet 1"
      - "/give {player} minecraft:iron_chestplate 1"
      - "/give {player} minecraft:iron_leggings 1"
      - "/give {player} minecraft:iron_boots 1"
    description: "§7购买一套铁质装备"

  - name: "32个金苹果"
    price: 100.00
    commands:
      - "/give {player} minecraft:golden_apple 32"
    description: "§e购买32个金苹果"

# 消息配置
messages:
  prefix: "§8[§6NoobHub支付§8]§r "
  payment-success: "§a支付成功! 商品已发货到您的背包。"
  payment-failed: "§c支付失败: {reason}"
  insufficient-funds: "§c您的余额不足! 需要: §e{price}§c, 当前: §e{balance}"
  product-not-found: "§c商品不存在!"
  player-offline: "§c玩家不在线,无法发货!"
  invalid-payment-method: "§c不支持的支付方式!"

  # GUI相关
  gui-title: "§6§lNoobHub商城"
  gui-balance: "§7当前余额: §e{balance}"
